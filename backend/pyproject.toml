[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "futvr-api"
version = "0.1.0"
description = "Private football screenshot analysis and immutable tactical publications"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18", "Pillow>=11,<13", "httpx>=0.28,<1", "numpy>=2,<3"]

[project.optional-dependencies]
inference = ["rfdetr==1.11.2"]
opencv = ["opencv-python-headless>=4.10,<5"]
supabase = ["supabase>=2.10,<3"]
modal = ["modal>=1.1,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["futvr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
